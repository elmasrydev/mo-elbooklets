overwrite: true
# schema.graphql is a committed snapshot of the live backend —
# refresh with `npm run schema:pull` after backend deployments.
schema:
  - "src/graphql/schema.graphql"
documents: "src/graphql/**/*.graphql"
generates:
  src/generated/:
    preset: "client"
    presetConfig:
      # Operations live in .graphql files and are consumed as plain typed
      # documents (useQuery(XxxDocument) / tryFetchWithFallback(XxxDocument));
      # fragment masking only benefits the gql-tag colocation style.
      fragmentMasking: false
    config:
      maybeValue: T | null
      inputMaybeValue: T | null
      scalars:
        ID: string
        String: string
        Boolean: boolean
        Int: number
        Float: number
        DateTime: string
        Date: string
hooks:
  afterOneFileWrite:
    - prettier --write
