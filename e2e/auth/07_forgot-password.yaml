appId: com.elbooklets.app
---
- launchApp

# Switch environment if needed
- runFlow:
    file: ../utils/setup-environment.yaml

# Student forgot password — WhatsApp code is the primary path.
- assertVisible:
    id: 'onboarding-student-tab'
- tapOn:
    id: 'onboarding-sign-in'
- assertVisible:
    id: 'login-forgot-password'
- tapOn:
    id: 'login-forgot-password'

# The mobile step leads, with the email link offered as the secondary option.
- assertVisible:
    id: 'forgot-mobile-input'
- assertVisible:
    id: 'forgot-email-link'
- tapOn:
    id: 'forgot-mobile-input'
# NOTE: this spends one WhatsApp message against STUDENT_MOBILE's shared quota
# (1/60s, 3/hour, 10/day across ALL four OTP flows). Run this flow sparingly, and
# not back-to-back with the login/register flows, or they will rate limit.
- inputText: ${STUDENT_MOBILE}
- tapOn:
    point: 50%,10%
- tapOn:
    id: 'forgot-send-button'

# A send only fails when rate limited; that surfaces as a modal. Dismiss it and
# stop there, since no code was issued.
- extendedWaitUntil:
    optional: true
    visible:
      id: 'confirm-modal-ok'
    timeout: 3000
- runFlow:
    when:
      visible:
        id: 'confirm-modal-ok'
    commands:
      - tapOn:
          id: 'confirm-modal-ok'
      - takeScreenshot: e2e/screenshots/forgot-password-rate-limited

# Otherwise the screen advances to the code step regardless of whether the number
# is registered — the API deliberately will not say which, so this is
# deterministic. We stop at "the reset form is reachable": completing a real
# reset would rotate the password of a shared test account and invalidate
# e2e/env.yaml for every other flow. Do that manually with a throwaway account.
# Gated on the reset form itself, NOT on `notVisible: confirm-modal-ok` — the
# branch above dismisses that modal, so the absence check would be true on the
# rate-limited path too and this block would wait for a form that never comes.
- runFlow:
    when:
      visible:
        id: 'forgot-reset-button'
    commands:
      - assertVisible:
          id: 'forgot-resend-button'
      - takeScreenshot: e2e/screenshots/forgot-password-code-step

# The email fallback still works from the same screen.
- runFlow:
    when:
      visible:
        id: 'forgot-email-link'
    commands:
      - tapOn:
          id: 'forgot-email-link'
      - assertVisible:
          id: 'forgot-email-input'
      - assertVisible:
          id: 'forgot-whatsapp-link'
      - takeScreenshot: e2e/screenshots/forgot-password-email-step
