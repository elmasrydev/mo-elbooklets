appId: com.elbooklets.app
---
- launchApp

# Switch environment if needed
- runFlow:
    file: ../utils/setup-environment.yaml

# Parent forgot password — same shared screen as the student, audience: 'parent'.
- assertVisible:
    id: 'onboarding-parent-tab'
- tapOn:
    id: 'onboarding-parent-tab'
- tapOn:
    id: 'onboarding-sign-in'
- assertVisible:
    id: 'parent-login-forgot-password'
- tapOn:
    id: 'parent-login-forgot-password'

- assertVisible:
    id: 'forgot-mobile-input'
- assertVisible:
    id: 'forgot-email-link'
- tapOn:
    id: 'forgot-mobile-input'
# NOTE: this spends one WhatsApp message against PARENT_MOBILE's shared quota
# (1/60s, 3/hour, 10/day across ALL four OTP flows). Run this flow sparingly, and
# not back-to-back with the parent login/register flows, or they will rate limit.
- inputText: ${PARENT_MOBILE}
- tapOn:
    point: 50%,10%
- tapOn:
    id: 'forgot-send-button'

# Rate limited → a modal with the server's message; nothing was issued.
# Unconditional: the send either surfaces the rate-limit modal or reaches the
# reset form. If neither appears the screen is broken, and this must fail rather
# than skip both conditional blocks below and report green.
- extendedWaitUntil:
    visible:
      id: 'confirm-modal-ok'
    timeout: 12000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'confirm-modal-ok'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'forgot-reset-button'
          timeout: 12000
- runFlow:
    when:
      visible:
        id: 'confirm-modal-ok'
    commands:
      - tapOn:
          id: 'confirm-modal-ok'
      - takeScreenshot: e2e/screenshots/parent-forgot-password-rate-limited

# Otherwise the code step is reachable. We stop here on purpose: completing the
# reset would rotate the shared parent test account's password and break every
# other parent flow. Verify a full reset manually with a throwaway account.
# Gated on the reset form itself, NOT on `notVisible: confirm-modal-ok` — the
# branch above dismisses that modal, so the absence check would be true on the
# rate-limited path too and this block would wait for a form that never comes.
- runFlow:
    when:
      visible:
        id: 'forgot-reset-button'
    commands:
      - assertVisible:
          id: 'forgot-resend-button'
      - takeScreenshot: e2e/screenshots/parent-forgot-password-code-step
