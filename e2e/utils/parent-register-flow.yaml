appId: com.elbooklets.app
---
# e2e/auth/parent-register-flow.yaml
# Actual registration steps run conditionally

- assertVisible:
    id: "onboarding-parent-tab"
- tapOn:
    id: "onboarding-parent-tab"
- tapOn:
    id: "onboarding-get-started"
- assertVisible:
    id: "parent-register-name"
# Dismiss the keyboard (tap top of screen) after every field — otherwise the
# keyboard covers the lower inputs and their taps land on the keyboard, sending
# the next inputText into the previously-focused field.
- tapOn:
    id: "parent-register-name"
- inputText: "Maestro Parent"
- tapOn:
    point: 50%,10%
- tapOn:
    id: "parent-register-mobile"
- inputText: ${PARENT_MOBILE}
- tapOn:
    point: 50%,10%
- tapOn:
    id: "parent-register-email"
- inputText: ${PARENT_EMAIL}
- tapOn:
    point: 50%,10%
# Password fields start hidden, and Maestro drops special chars typed into iOS secure
# fields — reveal both first so the password (incl. its symbol) types reliably
# (separate showPassword / showConfirmPassword state).
- tapOn:
    id: "parent-register-password-toggle"
- tapOn:
    id: "parent-register-confirm-toggle"
- tapOn:
    id: "parent-register-password"
- inputText: ${PARENT_PASSWORD}
- tapOn:
    point: 50%,10%
- tapOn:
    id: "parent-register-confirm"
- inputText: ${PARENT_PASSWORD}
- tapOn:
    point: 50%,10%
- tapOn:
    id: "parent-register-submit"

# Parents now verify their number with a WhatsApp code, same as students.
# Dismiss a rate-limit / error popup if the backend returns one.
- extendedWaitUntil:
    optional: true
    visible:
      id: "confirm-modal-ok"
    timeout: 2000
- runFlow:
    when:
      visible:
        id: "confirm-modal-ok"
    commands:
      - tapOn:
          id: "confirm-modal-ok"
      - extendedWaitUntil:
          notVisible:
            id: "confirm-modal-ok"
          timeout: 3000

# parentRegister auto-sends the code, so the gate opens on the entry step.
- runFlow: otp-handle.yaml

- extendedWaitUntil:
    visible:
      id: "parent-tab-add-child"
    timeout: 15000
- takeScreenshot: e2e/screenshots/parent-register-result
