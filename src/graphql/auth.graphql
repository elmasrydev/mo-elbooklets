# Authentication operations for both roles (AuthContext + OTP screen).

mutation Login($input: LoginInput!) {
  login(input: $input) {
    access_token
    user {
      id
      name
      email
      mobile
      country_code
      mobile_verified_at
      grade_id
      grade {
        id
        name
      }
      educational_system_id
      educational_system {
        id
        name
      }
      is_subscribed
    }
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    access_token
    user {
      id
      name
      email
      mobile
      country_code
      mobile_verified_at
      grade_id
      grade {
        id
        name
      }
      educational_system_id
      educational_system {
        id
        name
      }
      is_subscribed
    }
  }
}

# The signed-in student's full profile — the widest User selection in the app,
# so a refresh leaves nothing stale.
query Me {
  me {
    id
    name
    email
    mobile
    country_code
    mobile_verified_at
    gender
    school_name
    parent_mobile
    grade_id
    grade {
      id
      name
    }
    educational_system_id
    educational_system {
      id
      name
    }
    governorate_id
    governorate {
      id
      name_ar
      name_en
    }
    city_id
    city {
      id
      name_ar
      name_en
    }
    is_subscribed
    selectedAvatar {
      id
      name
      url
      gender
    }
  }
}

mutation ParentLogin($mobile: String!, $password: String!) {
  parentLogin(input: { mobile: $mobile, password: $password }) {
    access_token
    parent {
      id
      name
      mobile
      email
      country_code
      mobile_verified_at
    }
  }
}

mutation ParentRegister($name: String!, $mobile: String!, $email: String!, $password: String!) {
  parentRegister(input: { name: $name, mobile: $mobile, email: $email, password: $password }) {
    access_token
    parent {
      id
      name
      mobile
      email
      country_code
      mobile_verified_at
    }
  }
}

query ParentMe {
  parentMe {
    id
    name
    mobile
    email
    country_code
    mobile_verified_at
  }
}

mutation ParentForgotPassword($email: String!) {
  parentForgotPassword(email: $email) {
    success
    message
  }
}

# Early "is this mobile already registered?" check on the registration forms
# (BKLT-308). `message` comes back translated — display it as-is.
mutation CheckMobileAvailability($mobile: String!, $type: String) {
  checkMobileAvailability(mobile: $mobile, type: $type) {
    available
    message
  }
}

query GetGrades {
  grades {
    id
    name
  }
}

mutation DeleteAccount {
  deleteAccount {
    success
    message
  }
}

# Parents have their own deletion mutation. `deleteAccount` resolves against the
# student guard, so calling it with a parent token 500s (BKLT-323) — the parent
# app appeared to accept the deletion while the account stayed live.
mutation ParentDeleteAccount {
  parentDeleteAccount {
    success
    message
  }
}

mutation ForgotPassword($email: String!) {
  forgotPassword(email: $email) {
    success
    message
  }
}

mutation UpdatePassword($input: UpdatePasswordInput!) {
  updatePassword(input: $input) {
    success
    message
  }
}

# WhatsApp OTP — student number verification (OTPVerificationScreen).

mutation SendMobileOtp($mobile: String!, $country_code: String) {
  sendMobileOtp(mobile: $mobile, country_code: $country_code) {
    success
    message
    expires_in
  }
}

mutation VerifyMobileOtp($otp: String!) {
  verifyMobileOtp(otp: $otp) {
    success
    message
    user {
      id
      name
      email
      mobile
      country_code
      mobile_verified_at
      gender
      school_name
      parent_mobile
      grade_id
      grade {
        id
        name
      }
      educational_system_id
      educational_system {
        id
        name
      }
      governorate_id
      governorate {
        id
        name_ar
        name_en
      }
      city_id
      city {
        id
        name_ar
        name_en
      }
      is_subscribed
    }
  }
}

# WhatsApp OTP — parent number verification. A code issued for the student never
# works for the parent even on a shared handset (mobile-otp-guide.md section 2).

mutation SendParentMobileOtp($mobile: String!, $country_code: String) {
  sendParentMobileOtp(mobile: $mobile, country_code: $country_code) {
    success
    message
    expires_in
  }
}

mutation VerifyParentMobileOtp($otp: String!) {
  verifyParentMobileOtp(otp: $otp) {
    success
    message
    parent {
      id
      name
      mobile
      email
      country_code
      mobile_verified_at
    }
  }
}

# WhatsApp OTP — password reset. The send mutations are unauthenticated and
# anti-enumeration: an identical payload comes back whether or not the account
# exists, so never render one as "we found your account".

mutation SendPasswordResetOtp($mobile: String!, $country_code: String) {
  sendPasswordResetOtp(mobile: $mobile, country_code: $country_code) {
    success
    message
    expires_in
  }
}

mutation ResetPasswordWithOtp(
  $mobile: String!
  $country_code: String
  $otp: String!
  $password: String!
  $password_confirmation: String!
) {
  resetPasswordWithOtp(
    mobile: $mobile
    country_code: $country_code
    otp: $otp
    password: $password
    password_confirmation: $password_confirmation
  ) {
    success
    message
  }
}

mutation SendParentPasswordResetOtp($mobile: String!, $country_code: String) {
  sendParentPasswordResetOtp(mobile: $mobile, country_code: $country_code) {
    success
    message
    expires_in
  }
}

mutation ResetParentPasswordWithOtp(
  $mobile: String!
  $country_code: String
  $otp: String!
  $password: String!
  $password_confirmation: String!
) {
  resetParentPasswordWithOtp(
    mobile: $mobile
    country_code: $country_code
    otp: $otp
    password: $password
    password_confirmation: $password_confirmation
  ) {
    success
    message
  }
}
