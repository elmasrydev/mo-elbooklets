# Baccalaureate tracks & electives (contract:
# `mobile-baccalaureate-tracks-and-electives.md`, local-only).
#
# Deliberately its OWN set of documents, like `trial.graphql`: every field here
# is deployed on PRS but on neither demo nor production (checked 2026-10-26),
# and an operation selecting an unknown field fails *entirely*. Folded into
# `Me` / `Register` / `UpdateProfile` that would break sign-in and profile
# editing on those environments; kept here, the worst case is that these fail
# and the app shows no track UI (`CurriculumContext` fails open on `null`).

# Public — no token. Fetched without the system argument and filtered on the
# client (contract §2, "recommended"), so one fetch serves every grade/system
# combination the registration form can move through.
query CurriculumOptions {
  curriculumOptions {
    id
    name
    has_specialities
    core_electives {
      group
      label
      subjects {
        id
        name
        educational_system_ids
      }
    }
    specialities {
      id
      name
      description
      electives {
        group
        label
        subjects {
          id
          name
          educational_system_ids
        }
      }
    }
  }
}

# The signed-in student's picks and whether the server still wants them.
# `grade_id` / `educational_system_id` are already on `user` via `Me`.
query MyCurriculum {
  me {
    id
    speciality_id
    speciality {
      id
      name
    }
    elective_subjects {
      id
      name
    }
    profileCompleteness {
      needsCurriculum
    }
  }
}

# Track + the FULL elective list, always together (contract §5): the list
# replaces the student's picks, so a partial send fails validation. The
# selection mirrors `MyCurriculum` so the cache write flips `needsCurriculum`
# for the gate without a refetch.
mutation SaveCurriculum($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    id
    speciality_id
    speciality {
      id
      name
    }
    elective_subjects {
      id
      name
    }
    profileCompleteness {
      needsCurriculum
    }
  }
}
