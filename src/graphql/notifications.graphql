# In-app notifications + notification preferences, student and parent variants.
# Consumed by useNotifications / useNotificationPreferences via
# tryFetchWithFallback; `message`s arrive already localized (BKLT-273).

query UserNotifications($page: Int, $per_page: Int) {
  userNotifications(page: $page, per_page: $per_page) {
    data {
      id
      title
      body
      channel
      event_slug
      action_url
      is_read
      read_at
      created_at
    }
    total
    unread_count
    has_more
  }
}

mutation MarkNotificationRead($id: ID!) {
  markNotificationRead(id: $id) {
    read_at
  }
}

mutation MarkAllNotificationsRead {
  markAllNotificationsRead
}

query ParentNotifications($page: Int, $per_page: Int) {
  parentNotifications(page: $page, per_page: $per_page) {
    data {
      id
      title
      body
      channel
      event_slug
      action_url
      is_read
      read_at
      created_at
    }
    total
    unread_count
    has_more
  }
}

mutation ParentMarkNotificationRead($id: ID!) {
  parentMarkNotificationRead(id: $id) {
    read_at
  }
}

mutation ParentMarkAllNotificationsRead {
  parentMarkAllNotificationsRead
}

query GetNotificationPreferences {
  notificationPreferences {
    app_notifications_enabled
    social_notifications_enabled
  }
}

mutation UpdateNotificationPreferences($input: UpdateNotificationPreferencesInput!) {
  updateNotificationPreferences(input: $input) {
    app_notifications_enabled
    social_notifications_enabled
  }
}

query GetParentNotificationPreferences {
  parentNotificationPreferences {
    app_notifications_enabled
    social_notifications_enabled
  }
}

# Same input type as the student mutation — the backend has no parent-specific
# input (the old client document invented one, which failed server validation).
mutation ParentUpdateNotificationPreferences($input: UpdateNotificationPreferencesInput!) {
  parentUpdateNotificationPreferences(input: $input) {
    app_notifications_enabled
    social_notifications_enabled
  }
}

# Push-token registration, per role (notificationService).

mutation RegisterDeviceToken($token: String!, $platform: String!) {
  registerDeviceToken(token: $token, platform: $platform)
}

mutation ParentRegisterDeviceToken($token: String!, $platform: String!) {
  parentRegisterDeviceToken(token: $token, platform: $platform)
}

mutation UnregisterDeviceToken($token: String!) {
  unregisterDeviceToken(token: $token)
}

mutation ParentUnregisterDeviceToken($token: String!) {
  parentUnregisterDeviceToken(token: $token)
}
