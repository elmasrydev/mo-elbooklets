# Quiz funnel: history → subjects → lessons → settings → generating → taking
# → results → review. Selections mirror what the screens actually render.
# SubjectsForUserGrade is shared (quiz, study, leaderboard) — superset selection.

query UserQuizHistory {
  userQuizHistory {
    id
    name
    subject {
      id
      name
      language
    }
    score
    totalQuestions
    completedAt
    isPassed
  }
}

query SubjectsForUserGrade {
  subjectsForUserGrade {
    id
    name
    description
    language
    chapters {
      id
    }
  }
}

query QuizTypes {
  quizTypes {
    id
    name
    slug
    question_count
    is_default
  }
}

query LessonsForSubject($subjectId: ID!) {
  lessonsForSubject(subjectId: $subjectId) {
    id
    name
    description
    lessons {
      id
      name
      description
      isLocked
    }
  }
}

# What the chosen lessons can actually be quizzed on. Run this after the lessons
# are picked and before rendering the type picker: types with no questions are
# omitted from `types` entirely, so never pad the list from a hardcoded set.
query LessonQuestionTypes($lessonIds: [ID!]!) {
  lessonQuestionTypes(lessonIds: $lessonIds) {
    total
    minSelectedTypes
    types {
      type
      label
      count
    }
  }
}

# `questionTypes` restricts the quiz to the chosen types. Omit it for the
# default mix — sending every type means the same thing with more code.
mutation StartQuiz(
  $subjectId: ID!
  $lessonIds: [ID!]!
  $quizTypeId: ID
  $questionTypes: [String!]
) {
  startQuiz(
    subjectId: $subjectId
    lessonIds: $lessonIds
    quizTypeId: $quizTypeId
    questionTypes: $questionTypes
  ) {
    id
  }
}

query Quiz($quizId: ID!) {
  quiz(quizId: $quizId) {
    id
    name
    subject {
      id
      name
      language
    }
    questions {
      id
      question
      type
      answers
      questionNumber
      difficulty

      # Image attachment — orthogonal to type; may appear on any question.
      imageUrl

      # type == "match": two independently shuffled columns to connect.
      # ids ("L0"/"R0"…) are echoed back verbatim on submit.
      matchPairs {
        left {
          id
          text
        }
        right {
          id
          text
        }
      }

      # type == "paragraph": ordered sub-questions (always mcq/true_false).
      # Each is a fully-formed question that can carry its own imageUrl.
      subQuestions {
        id
        questionNumber
        type
        question
        answers
        imageUrl
      }
    }
    isCompleted
    score
  }
}

mutation SubmitQuizAnswers($quizId: ID!, $answers: [QuestionAnswerInput!]!) {
  submitQuizAnswers(quizId: $quizId, answers: $answers) {
    score
    totalQuestions
    isPassed
  }
}

query QuizResults($quizId: ID!) {
  quizResults(quizId: $quizId) {
    quiz {
      id
      name
      subject {
        id
        name
        language
      }
      lessons {
        id
        name
        chapter {
          name
        }
      }
    }
    score
    totalQuestions
    xp
    userAnswers {
      question {
        id
        question
        type
        answer_1
        explanation
      }
      selected_answer
      is_correct
      score
      explanation
      descriptive_feedback {
        coverage_percentage
        score_out_of_10
      }
    }
    isPassed
    isPublished
  }
}

# Same root field as QuizResults with the deeper review selection (all four
# answer options + full descriptive feedback).
query QuizReview($quizId: ID!) {
  quizResults(quizId: $quizId) {
    quiz {
      id
      name
      subject {
        id
        name
        language
      }
    }
    isPublished
    userAnswers {
      question {
        id
        question
        type
        answer_1
        answer_2
        answer_3
        answer_4
        explanation

        # Image attachment (any question, including paragraph children).
        imageUrl

        # type == "match": canonical unshuffled columns (left[i] ↔ right[i]),
        # to resolve match_results ids to text and show the correct pairing.
        matchColumns {
          left {
            id
            text
          }
          right {
            id
            text
          }
        }

        # Paragraph passage carrier — set on sub-question rows so review can
        # group children under their passage text.
        parent {
          id
          question
        }
      }
      selected_answer
      is_correct
      score
      explanation

      # type == "paragraph": groups sub-question rows under their parent.
      parent_question_id

      # type == "match": per-pair correctness (same leftId/rightId as matchColumns).
      match_results {
        leftId
        rightId
        isCorrect
      }

      descriptive_feedback {
        coverage_percentage
        score_out_of_10
        covered_concepts
        partially_covered
        missing_concepts
        contradictions
        feedback
      }
    }
  }
}

mutation PublishQuizToFeed($quizId: ID!) {
  publishQuizToFeed(quizId: $quizId) {
    success
    message
  }
}
