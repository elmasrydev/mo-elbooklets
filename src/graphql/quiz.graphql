# Quiz-related Queries and Mutations.
# NOTE: the quiz screens still run inline strings via tryFetchWithFallback —
# they adopt these typed documents when they migrate (phase 2). The stale
# Quiz / QuizResults / LessonsForSubject documents that used to live here no
# longer matched the live schema and had no consumers.

query UserQuizHistory {
  userQuizHistory {
    id
    name
    subject {
      id
      name
    }
    score
    totalQuestions
    completedAt
    isPassed
  }
}

query SubjectsForUserGrade {
  subjectsForUserGrade {
    id
    name
    description
  }
}

mutation StartQuiz($subjectId: ID!, $lessonIds: [ID!]!) {
  startQuiz(subjectId: $subjectId, lessonIds: $lessonIds) {
    id
    name
    questions {
      id
      question
      answers
      questionNumber
    }
  }
}

mutation SubmitQuizAnswers($quizId: ID!, $answers: [QuestionAnswerInput!]!) {
  submitQuizAnswers(quizId: $quizId, answers: $answers) {
    quiz {
      id
      name
    }
    score
    totalQuestions
    isPassed
  }
}
