  """Get subjects for authenticated user's grade"""
  subjectsForUserGrade: [Subject!]!

  """Get today's study schedule with live completion data"""
  todaySchedule: TodayScheduleResult!

  """Get authenticated student's notifications with pagination"""
  userNotifications(page: Int, per_page: Int): NotificationPage!

  """Get authenticated user's quiz history"""
  userQuizHistory: [UserQuizHistory!]!

  """Get Wheel of Success progress data"""
  wheelOfSuccess: WheelOfSuccess!
}

"""Question type"""
type Question {
  """
  The correct answer. Null for `match` and `paragraph`, which have no single answer — match stores its pairs in `matchColumns`, paragraph keeps its answers on the sub-questions.
  """
  answer_1: String
  answer_2: String
  answer_3: String
  answer_4: String
  created_at: DateTime!
  difficulty: Int!
  explanation: String
  id: ID!

  """
  Absolute URL of the attached image, if any. Render it on the results screen the same way you did during the quiz.
  """
  imageUrl: String
  lesson: Lesson
  lesson_id: ID!

  """
  Canonical (unshuffled) match columns, so results screens can resolve the leftId/rightId in `match_results` back to their text. Null unless type == "match".
  """
  matchColumns: MatchColumns

  """
  The parent paragraph question (carries the passage text). Null unless this is a paragraph sub-question.
  """
  parent: Question
  question: String!
  tag: String
  type: String!
  updated_at: DateTime!
}

"""Question Answer Input"""
input QuestionAnswerInput {
  """match question: the chosen left->right mappings"""
  matchPairs: [MatchPairInput!]
  questionId: ID!

  """mcq / true_false / image / descriptive answer"""
  selectedAnswer: String

  """paragraph question: answers to each ordered sub-question"""
  subAnswers: [QuestionAnswerInput!]
}

"""Result of reporting a question"""
type QuestionReportResult {
  message: String
  success: Boolean!
}

"""Available report types for questions"""
type QuestionReportType {
  id: ID!
  name: String!
  name_ar: String
  name_en: String
}

"""Quiz type"""
type Quiz {
  created_at: DateTime!
