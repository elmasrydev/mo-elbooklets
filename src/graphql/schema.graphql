  name_ar: String
  name_en: String
  questions: [QuizQuestion!]!
  quizType: QuizType
  quiz_type_id: ID
  score: Int

  """
  Start anchor for the current user's attempt. The client runs its own count-up timer from this so the elapsed time survives app restarts. Null when tracking is off or not started.
  """
  startedAt: DateTime
  subject: Subject
  subject_id: ID!

  """
  Whether time tracking is enabled for the current user's attempt (ON by default).
  """
  timeTrackingEnabled: Boolean!
  updated_at: DateTime!
}

"""Quiz completion data for feed items"""
type QuizCompletionData {
